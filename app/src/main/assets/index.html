<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KPFA CPUC Pigeon App</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#101b35;color:#fff}
header{background:#172b50;padding:20px;text-align:center;border-bottom:3px solid #dcae45}
h1,h2{color:#f5cf70}
h1{font-size:23px;margin:0 0 8px}
main{max-width:650px;margin:auto;padding:16px}
.panel{background:#1b2b4b;padding:17px;border-radius:14px;margin:14px 0}
input,select,textarea,button{width:100%;padding:12px;margin:7px 0;border-radius:8px;font-size:16px}
input,select,textarea{border:1px solid #7183a4;background:#fff;color:#111}
button{border:0;background:#dcae45;color:#17213b;font-weight:bold}
.secondary{background:#344766;color:white}
.hidden{display:none!important}
.small{font-size:13px;color:#d6dff0;overflow-wrap:anywhere;white-space:pre-wrap}
.item{background:#253b60;padding:12px;border-radius:8px;margin:8px 0;overflow-wrap:anywhere}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.comp{background:#253b60;color:white;border:1px solid #dcae45;padding:12px;min-height:120px;line-height:1.5}
.date{color:#f5cf70;font-weight:bold;display:block}
.cup{font-size:26px;display:block}
.result{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.6}
</style>
</head>
<body>
<header>
<h1>KPFA • CPUC</h1>
<div>Karumbukkadai Pigeon Friends Association</div>
</header>
<main>
<section id="login" class="panel">
<h2>Member Login</h2>
<input id="email" type="email" placeholder="Email address" autocomplete="email">
<input id="password" type="password" placeholder="Password" autocomplete="current-password">
<button type="button" onclick="loginUser()">Login</button>
<button type="button" class="secondary" onclick="showPage('register')">Create Account</button>
<p id="authMessage" class="small" role="status"></p>
</section>

<section id="register" class="panel hidden">
<h2>Create Account</h2>
<label>Club</label>
<select id="regClub">
<option value="KPFA">KPFA - Local</option>
<option value="CPUC">CPUC - District Level</option>
</select>
<input id="loftName" placeholder="Loft Name">
<input id="ownerName" placeholder="Loft Owner">
<input id="contactNumber" type="tel" placeholder="Contact Number">
<input id="areaName" placeholder="Place / Area">
<input id="regEmail" type="email" placeholder="Email address">
<input id="regPassword" type="password" placeholder="Password (minimum 6 characters)">
<button type="button" onclick="registerUser()">Register</button>
<button type="button" class="secondary" onclick="showPage('login')">Back to Login</button>
<p id="regMessage" class="small" role="status"></p>
</section>

<section id="pending" class="panel hidden">
<h2>Pending Approval</h2>
<p>Your registration is awaiting Admin approval.</p>
<p id="pendingInfo" class="small"></p>
<button class="secondary" onclick="logoutUser()">Logout</button>
</section>

<section id="admin" class="panel hidden">
<h2>Admin Approval</h2>
<div id="pendingMembers">Loading...</div>
<button onclick="loadPendingMembers()">Refresh Requests</button>
<button class="secondary" onclick="showPage('home')">Back</button>
<button class="secondary" onclick="logoutUser()">Logout</button>
</section>

<section id="home" class="panel hidden">
<h2>Welcome</h2>
<p id="userEmail" class="small"></p>
<p id="memberInfo" class="small"></p>
<button onclick="openClub('KPFA')">KPFA - Local</button>
<button onclick="openClub('CPUC')">CPUC - District Level</button>
<button id="adminButton" class="hidden" onclick="showAdmin()">Admin Approval</button>
<button class="secondary" onclick="logoutUser()">Logout</button>
</section>

<section id="club" class="panel hidden">
<h2 id="clubTitle"></h2>
<button onclick="openSection('Competition Results')">COMPLETE RESULT</button>
<button onclick="openSection('Race Details')">Race Details</button>
<button onclick="openSection('Participants')">Participants</button>
<button onclick="openSection('Championship')">Championship</button>
<button class="secondary" onclick="showPage('home')">Back</button>
</section>

<section id="details" class="panel hidden">
<h2 id="sectionTitle"></h2>
<div id="legacyEditor">
<input id="recordTitle" placeholder="Title / Race / Participant name">
<textarea id="recordText" rows="4" placeholder="Enter result, timing, points or details"></textarea>
<button onclick="saveRecord()">Save Online</button>
<button class="secondary" onclick="loadRecords()">Refresh Records</button>
</div>

<div id="competitionAdmin" class="hidden">
<h2>ADMIN - ADD / UPDATE COMPETITION</h2>
<label>Competition</label>
<select id="competitionSlot" onchange="loadCompetitionIntoForm()"></select>
<label>Date</label>
<input id="competitionDate" type="date">
<label>Duration</label>
<select id="competitionDuration">
<option>ONE DAY</option>
<option>TWO DAYS</option>
<option>THREE DAYS</option>
<option>SEVEN DAYS</option>
</select>
<label>Pigeon Type</label>
<select id="competitionType">
<option>KARNAM PIGEON</option>
<option>HY FLYER PIGEON</option>
</select>
<textarea id="competitionResult" rows="8" placeholder="RANK 1&#10;LOFT NAME:&#10;BIRDS FLYING TIME:&#10;TOTAL FLYING TIME:"></textarea>
<button onclick="saveCompetition()">SAVE / UPDATE COMPETITION</button>
<p id="competitionMessage" class="small"></p>
</div>

<div id="competitionGrid" class="grid"></div>

<div id="competitionDetail" class="panel hidden">
<h2 id="competitionDetailTitle"></h2>
<div id="competitionDetailText" class="result"></div>
<button id="editCompetitionButton" class="hidden" onclick="editSelectedCompetition()">EDIT RESULT (ADMIN)</button>
<button class="secondary" onclick="closeCompetition()">BACK TO COMPLETE RESULT</button>
</div>

<button class="secondary" onclick="showPage('club')">Back to Club</button>
<p id="saveMessage" class="small"></p>
<div id="legacyRecordsPanel">
<h2>Saved Records</h2>
<div id="records" class="small">Sign in to view records.</div>
</div>
</section>
</main>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>

<script>
const firebaseConfig={
apiKey:"AIzaSyD9_4Fq2UpnVmYf8J7ERswACoFM-YiTexk",
authDomain:"kpfa-cpuc.firebaseapp.com",
databaseURL:"https://kpfa-cpuc-default-rtdb.asia-southeast1.firebasedatabase.app",
projectId:"kpfa-cpuc",
storageBucket:"kpfa-cpuc.firebasestorage.app",
messagingSenderId:"445696991705",
appId:"1:445696991705:web:076102fbe42afa2c7239c8"
};

const ADMIN_EMAIL="lathifafra@gmail.com";
const COMPETITION_COUNT=13;
let auth=null,db=null,currentClub="KPFA",currentSection="Competition Results",currentProfile=null,selectedSlot=1,entries={};

const $=id=>document.getElementById(id);
function msg(id,t){$(id).textContent=t}

function showPage(id){
['login','register','pending','admin','home','club','details'].forEach(
x=>$(x).classList.toggle('hidden',x!==id)
);
}

function isAdmin(){
return !!(auth&&auth.currentUser&&auth.currentUser.email&&auth.currentUser.email.toLowerCase()===ADMIN_EMAIL.toLowerCase());
}

function initializeFirebase(){
try{
if(typeof firebase==='undefined'){
msg('authMessage','Firebase SDK failed to load. Check internet connection.');
return false;
}
if(!firebase.apps.length)firebase.initializeApp(firebaseConfig);
auth=firebase.auth();
db=firebase.database();
populateSlots();
auth.onAuthStateChanged(handleAuthState);
return true;
}catch(e){
msg('authMessage','Firebase setup error: '+e.message);
return false;
}
}

function loginUser(){
if(!auth&&!initializeFirebase())return;
let email=$('email').value.trim(),password=$('password').value;
if(!email||!password){
msg('authMessage','Please enter email and password.');
return;
}
msg('authMessage','Logging in...');
auth.signInWithEmailAndPassword(email,password).catch(
e=>msg('authMessage','Login error: '+e.message)
);
}

function registerUser(){
if(!auth&&!initializeFirebase())return;
let club=$('regClub').value,
loftName=$('loftName').value.trim(),
ownerName=$('ownerName').value.trim(),
contactNumber=$('contactNumber').value.trim(),
areaName=$('areaName').value.trim(),
email=$('regEmail').value.trim(),
password=$('regPassword').value;

if(!loftName||!ownerName||!contactNumber||!areaName||!email||!password){
msg('regMessage','Please fill in all fields.');
return;
}
if(!/^[0-9+()\-\s]{7,20}$/.test(contactNumber)){
msg('regMessage','Please enter a valid contact number.');
return;
}
if(password.length<6){
msg('regMessage','Password must be at least 6 characters.');
return;
}
msg('regMessage','Creating account...');
auth.createUserWithEmailAndPassword(email,password)
.then(c=>db.ref('members/'+c.user.uid).set({
club,loftName,ownerName,contactNumber,areaName,email,
status:'pending',role:'member',createdAt:Date.now()
}).then(()=>{
msg('regMessage','Registration submitted. Waiting for Admin approval.');
msg('pendingInfo','Club: '+club+' | Loft: '+loftName);
showPage('pending');
}))
.catch(e=>msg('regMessage','Registration error: '+e.message));
}

function handleAuthState(user){
if(!user){
currentProfile=null;
showPage('login');
if($('records'))msg('records','Please login to view records.');
return;
}
if(user.email&&user.email.toLowerCase()===ADMIN_EMAIL.toLowerCase()){
msg('userEmail',user.email);
msg('memberInfo','Administrator');
$('adminButton').classList.remove('hidden');
showPage('home');
return;
}
db.ref('members/'+user.uid).once('value').then(s=>{
if(!auth.currentUser||auth.currentUser.uid!==user.uid)return;
if(!s.exists()){
msg('pendingInfo','Profile not found. Contact Admin.');
showPage('pending');
return;
}
currentProfile=s.val();
if(currentProfile.status!=='approved'){
msg('pendingInfo','Club: '+(currentProfile.club||'')+' | Loft: '+(currentProfile.loftName||''));
showPage('pending');
return;
}
msg('userEmail',user.email||'');
msg('memberInfo',(currentProfile.club||'')+' | '+(currentProfile.loftName||'')+' | '+(currentProfile.areaName||''));
$('adminButton').classList.add('hidden');
showPage('home');
}).catch(e=>{
msg('pendingInfo','Unable to check approval: '+e.message);
showPage('pending');
});
}

function logoutUser(){
if(auth)auth.signOut().catch(e=>msg('authMessage','Logout error: '+e.message));
}

function showAdmin(){
if(!isAdmin())return;
showPage('admin');
loadPendingMembers();
}

function loadPendingMembers(){
if(!isAdmin())return;
let t=$('pendingMembers');
t.textContent='Loading...';
db.ref('members').once('value').then(s=>{
t.replaceChildren();
let n=0;
s.forEach(c=>{
let m=c.val()||{};
if(m.status!=='pending')return;
n++;
let card=document.createElement('div');
card.className='item';
let p=document.createElement('p');
p.style.whiteSpace='pre-line';
p.textContent=`Club: ${m.club||''}
Loft: ${m.loftName||''}
Owner: ${m.ownerName||''}
Contact: ${m.contactNumber||''}
Area: ${m.areaName||''}
Email: ${m.email||''}`;
let b=document.createElement('button');
b.textContent='Approve Member';
b.onclick=()=>{
if(confirm('Approve this member?')){
db.ref('members/'+c.key+'/status').set('approved')
.then(loadPendingMembers)
.catch(e=>t.textContent='Approval error: '+e.message);
}
};
card.append(p,b);
t.append(card);
});
if(!n)t.textContent='No pending registrations.';
}).catch(e=>t.textContent='Error: '+e.message);
}

function canAccessClub(c){
return isAdmin()||!!(currentProfile&&currentProfile.status==='approved'&&currentProfile.club===c);
}

function openClub(c){
if(!canAccessClub(c)){
alert('You are not approved for this club.');
return;
}
currentClub=c;
msg('clubTitle',c==='KPFA'?'KPFA - Local':'CPUC - District Level');
showPage('club');
}

function openSection(s){
if(!canAccessClub(currentClub)){
alert('Admin approval is required.');
return;
}
currentSection=s;
msg('sectionTitle',currentClub+' - '+s);
let results=s==='Competition Results';
$('legacyEditor').classList.toggle('hidden',results||!isAdmin());
$('legacyRecordsPanel').classList.toggle('hidden',results);
$('competitionAdmin').classList.toggle('hidden',!results||!isAdmin());
$('competitionGrid').classList.toggle('hidden',!results);
$('competitionDetail').classList.add('hidden');
showPage('details');
if(results)loadCompetitions();
else loadRecords();
}

function recordPath(){
return 'clubs/'+currentClub+'/'+currentSection.replace(/\s+/g,'_');
}

function saveRecord(){
if(!isAdmin()){
msg('saveMessage','Only Admin can add records.');
return;
}
let title=$('recordTitle').value.trim(),detail=$('recordText').value.trim();
if(!title||!detail){
msg('saveMessage','Enter both title and details.');
return;
}
msg('saveMessage','Saving...');
db.ref(recordPath()).push({
title,detail,createdAt:Date.now(),createdBy:auth.currentUser.email||''
}).then(()=>{
msg('saveMessage','Saved successfully.');
$('recordTitle').value='';
$('recordText').value='';
loadRecords();
}).catch(e=>msg('saveMessage','Database error: '+e.message));
}

function loadRecords(){
let t=$('records');
if(!auth||!auth.currentUser){
t.textContent='Please login first.';
return;
}
if(!canAccessClub(currentClub)){
t.textContent='Admin approval required.';
return;
}
t.textContent='Loading...';
db.ref(recordPath()).once('value').then(s=>{
t.replaceChildren();
if(!s.exists()){
t.textContent='No records yet.';
return;
}
s.forEach(c=>{
let v=c.val()||{},d=document.createElement('div');
d.className='item';
let b=document.createElement('b');
b.textContent=v.title||'Record';
let p=document.createElement('p');
p.textContent=v.detail||'';
d.append(b,p);
t.append(d);
});
}).catch(e=>t.textContent='Database error: '+e.message);
}

function competitionPath(){
return 'clubs/'+currentClub+'/Competition_Results';
}

function compId(n){
return 'competition_'+String(n).padStart(2,'0');
}

function populateSlots(){
let s=$('competitionSlot');
if(!s)return;
s.replaceChildren();
for(let i=1;i<=COMPETITION_COUNT;i++){
let o=document.createElement('option');
o.value=i;
o.textContent='COMPETITION '+String(i).padStart(2,'0');
s.append(o);
}
}

function defaultComp(i){
return {
competitionId:compId(i),
date:i===1?'2026-06-21':'',
duration:'ONE DAY',
type:'KARNAM PIGEON',
detail:''
};
}

function loadCompetitions(){
let g=$('competitionGrid');
g.textContent='Loading competitions...';
db.ref(competitionPath()).once('value').then(s=>{
entries={};
s.forEach(c=>{
let v=c.val()||{};
if(v.competitionId)entries[v.competitionId]=v;
});
g.replaceChildren();
for(let i=1;i<=13;i++){
let v=entries[compId(i)]||defaultComp(i),b=document.createElement('button');
b.type='button';
b.className='comp';
let cup=document.createElement('span');
cup.className='cup';
cup.textContent='🏆';
let d=document.createElement('span');
d.className='date';
d.textContent=v.date?v.date.split('-').reverse().join('.'):'DATE NOT SET';
b.append(cup,d,document.createElement('br'),document.createTextNode((v.duration||'ONE DAY')+'\n'+(v.type||'KARNAM PIGEON')));
b.onclick=()=>openCompetition(i,entries[compId(i)]||null);
g.append(b);
}
}).catch(e=>g.textContent='Unable to load competitions: '+e.message);
}

function loadCompetitionIntoForm(){
let i=Number($('competitionSlot').value),v=entries[compId(i)]||defaultComp(i);
$('competitionDate').value=v.date||'';
$('competitionDuration').value=v.duration||'ONE DAY';
$('competitionType').value=v.type||'KARNAM PIGEON';
$('competitionResult').value=v.detail||'';
}

function openCompetition(i,v){
selectedSlot=i;
$('competitionDetail').classList.remove('hidden');
$('editCompetitionButton').classList.toggle('hidden',!isAdmin());
v=v||defaultComp(i);
msg('competitionDetailTitle',(v.date?v.date.split('-').reverse().join('.'):'COMPETITION '+String(i).padStart(2,'0'))+' - '+v.duration+' '+v.type);
msg('competitionDetailText',v.detail||'RESULT NOT ADDED YET');
if(isAdmin()){
$('competitionSlot').value=i;
loadCompetitionIntoForm();
msg('competitionMessage','Edit result details, then save.');
}
}

function editSelectedCompetition(){
if(!isAdmin())return;
$('competitionAdmin').classList.remove('hidden');
$('competitionSlot').value=selectedSlot;
loadCompetitionIntoForm();
$('competitionDate').focus();
}

function saveCompetition(){
if(!isAdmin()){
msg('competitionMessage','Only Admin can save results.');
return;
}
let i=Number($('competitionSlot').value),
date=$('competitionDate').value,
detail=$('competitionResult').value.trim();
if(!date||!detail){
msg('competitionMessage','Enter date and result details.');
return;
}
let v={
competitionId:compId(i),
date,
duration:$('competitionDuration').value,
type:$('competitionType').value,
detail,
updatedAt:Date.now(),
updatedBy:auth.currentUser.email||''
};
msg('competitionMessage','Saving...');
db.ref(competitionPath()+'/'+compId(i)).set(v).then(()=>{
msg('competitionMessage','Saved successfully.');
loadCompetitions();
}).catch(e=>msg('competitionMessage','Save error: '+e.message));
}

function closeCompetition(){
$('competitionDetail').classList.add('hidden');
}

window.addEventListener('error',e=>{
let m='JavaScript error: '+e.message;
if($('authMessage')&&!$('authMessage').textContent)$('authMessage').textContent=m;
console.error(m);
});

document.addEventListener('DOMContentLoaded',initializeFirebase);
</script>
</body>
</html>
