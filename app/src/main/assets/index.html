<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KPFA CPUC Pigeon App</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#101b35;color:#fff}
header{background:#172b50;padding:20px;text-align:center;border-bottom:3px solid #dcae45}
h1{color:#f5cf70;font-size:23px;margin:0 0 8px}
h2{color:#f5cf70}
main{max-width:600px;margin:auto;padding:18px}
.panel{background:#1b2b4b;padding:18px;border-radius:14px;margin:14px 0}
input,select,textarea,button{width:100%;padding:12px;margin:7px 0;border-radius:8px;font-size:16px}
input,select,textarea{border:1px solid #7183a4;background:#fff;color:#111}
button{border:0;background:#dcae45;color:#17213b;font-weight:bold;cursor:pointer}
.secondary{background:#344766;color:white}
.item{background:#253b60;padding:12px;border-radius:8px;margin:8px 0;overflow-wrap:anywhere}
.small{font-size:13px;color:#d6dff0}
.hidden{display:none!important}
#authMessage,#saveMessage{overflow-wrap:anywhere}
.competition-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.competition-card{background:#253b60;color:white;border:1px solid #dcae45;padding:14px 8px;min-height:132px;white-space:pre-line;line-height:1.5}
.competition-card .cup{font-size:28px;display:block}
.competition-card .date{font-weight:bold;color:#f5cf70}
.competition-card .type{font-size:13px}
.result-line{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.65}
/* Member result popup */
#competitionDetail.popup-open{position:fixed;inset:0;z-index:9999;margin:0;border-radius:0;background:rgba(5,10,24,.96);padding:18px;overflow-y:auto;display:flex;flex-direction:column;justify-content:flex-start;box-shadow:none}
#competitionDetail.popup-open h2{text-align:center;margin-top:8px}
#competitionDetail.popup-open #competitionDetailTitle{font-size:20px}
#competitionDetail.popup-open #competitionDetailText{display:grid;grid-template-columns:1fr;gap:10px;white-space:normal}
.rank-card{background:linear-gradient(135deg,#253b60,#172b50);border:1px solid #dcae45;border-radius:12px;padding:13px;color:#fff;overflow-wrap:anywhere;box-shadow:0 5px 16px #0003}
.rank-card .rank-label{color:#f5cf70;font-weight:bold;font-size:17px;margin-bottom:6px}
.rank-card .rank-detail{white-space:pre-wrap;line-height:1.6}
.rank-card:nth-child(1){border-width:2px}
#competitionDetail.popup-open button{flex-shrink:0}
@media(min-width:500px){#competitionDetail.popup-open{inset:4vh 5vw;border:2px solid #dcae45;border-radius:18px;max-width:650px;margin:auto;height:92vh}}
</style>
</head>
<body>
<header>
<h1>KPFA • CPUC</h1>
<div>Karumbukkadai Pigeon Friends Association</div>
</header>
<main>
<section id="login" class="panel">
<h2>Member Login</h2>
<input id="email" type="email" placeholder="Email address" autocomplete="email">
<input id="password" type="password" placeholder="Password" autocomplete="current-password">
<button onclick="loginUser()">Login</button>
<button class="secondary" onclick="showRegister()">Create Account</button>
<p id="authMessage" class="small" role="status"></p>
</section>
<section id="register" class="panel hidden">
<h2>Register</h2>
<label for="regClub">Club</label>
<select id="regClub"><option value="KPFA">KPFA - Local</option><option value="CPUC">CPUC - District Level</option></select>
<input id="loftName" placeholder="Loft Name" autocomplete="organization">
<input id="ownerName" placeholder="Loft Owner" autocomplete="name">
<input id="contactNumber" type="tel" placeholder="Contact Number" autocomplete="tel">
<input id="areaName" placeholder="Place / Area" autocomplete="address-level2">
<input id="regEmail" type="email" placeholder="Email address" autocomplete="email">
<input id="regPassword" type="password" placeholder="Password (minimum 6 characters)" autocomplete="new-password">
<button onclick="registerUser()">Register</button>
<button class="secondary" onclick="show('login')">Back to Login</button>
<p id="regMessage" class="small" role="status"></p>
</section>
<section id="pending" class="panel hidden">
<h2>Pending Approval</h2><p>Your registration has been submitted.</p><p>Please wait for Admin approval.</p>
<p id="pendingInfo" class="small"></p><button class="secondary" onclick="logoutUser()">Logout</button>
</section>
<section id="admin" class="panel hidden">
<h2>Admin Approval</h2><p class="small">Pending member registrations</p><div id="pendingMembers">Loading...</div>
<button class="secondary" onclick="loadPendingMembers()">Refresh Requests</button>
<button class="secondary" onclick="goHome()">Back</button><button class="secondary" onclick="logoutUser()">Logout</button>
</section>
<section id="home" class="hidden"><div class="panel">
<h2>Welcome</h2><p id="userEmail" class="small"></p><p id="memberInfo" class="small"></p>
<button onclick="openClub('KPFA')">KPFA - Local</button><button onclick="openClub('CPUC')">CPUC - District Level</button>
<button id="adminButton" class="hidden" onclick="showAdmin()">Admin Approval</button><button class="secondary" onclick="logoutUser()">Logout</button>
</div></section>
<section id="club" class="hidden"><div class="panel">
<h2 id="clubTitle"></h2>
<button onclick="openSection('Competition Results')">COMPLETE RESULT</button>
<button onclick="openSection('Race Details')">Race Details</button>
<button onclick="openSection('Participants')">Participants</button>
<button onclick="openSection('Championship')">Championship</button>
<button class="secondary" onclick="goHome()">Back</button>
</div></section> 
 <section id="details" class="hidden">
<div class="panel">
<h2 id="sectionTitle"></h2>
<div id="records"></div>
<div id="adminTools" class="hidden">
<h2>ADMIN TOOLS</h2>
<label for="recordTitle">Title</label>
<input id="recordTitle" placeholder="Enter title">
<label for="recordText">Details</label>
<textarea id="recordText" rows="5" placeholder="Enter details"></textarea>
<button onclick="saveRecord()">SAVE DETAILS</button>
<p id="saveMessage" class="small"></p>
</div>
<button class="secondary" onclick="goBack()">BACK</button>
</div>
</section>
<section id="competitionDetail" class="panel hidden">
<h2 id="competitionDetailTitle"></h2>
<div id="competitionDetailText" class="result-line"></div>
<button class="secondary" onclick="closeCompetitionDetail()">CLOSE</button>
</section>
<section id="competitionAdmin" class="panel hidden">
<h2>EDIT COMPETITION (ADMIN)</h2>
<label for="competitionSlot">Competition</label>
<select id="competitionSlot">
<option value="1">Competition 1</option>
<option value="2">Competition 2</option>
<option value="3">Competition 3</option>
<option value="4">Competition 4</option>
<option value="5">Competition 5</option>
<option value="6">Competition 6</option>
<option value="7">Competition 7</option>
<option value="8">Competition 8</option>
<option value="9">Competition 9</option>
<option value="10">Competition 10</option>
<option value="11">Competition 11</option>
<option value="12">Competition 12</option>
<option value="13">Competition 13</option>
</select>
<label for="competitionName">Competition Name</label>
<input id="competitionName" placeholder="Competition name">
<label for="competitionDate">Date</label>
<input id="competitionDate" type="date">
<label for="competitionType">Competition Type</label>
<select id="competitionType">
<option value="One Day">One Day</option>
<option value="Two Days">Two Days</option>
<option value="Three Days">Three Days</option>
<option value="Seven Days">Seven Days</option>
</select>
<label for="competitionLoft">Loft Name</label>
<input id="competitionLoft" placeholder="Loft name">
<label for="competitionTime">Birds Flying Time</label>
<input id="competitionTime" placeholder="Example: 12h 30m">
<label for="competitionResult">Result Details</label>
<textarea id="competitionResult" rows="5" placeholder="Enter competition results"></textarea>
<button onclick="saveCompetition()">SAVE RESULT</button>
<button class="secondary" onclick="editSelectedCompetition()">EDIT RESULT (ADMIN)</button>
<p id="competitionMessage" class="small"></p>
</section>
</main>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyDUMMY_KEY_REPLACE_WITH_YOUR_REAL_KEY",
  authDomain: "kpfa-cpuc.firebaseapp.com",
  databaseURL: "https://kpfa-cpuc-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "kpfa-cpuc",
  storageBucket: "kpfa-cpuc.firebasestorage.app",
  messagingSenderId: "REPLACE_WITH_YOUR_SENDER_ID",
  appId: "REPLACE_WITH_YOUR_APP_ID"
};
firebase.initializeApp(firebaseConfig);
const auth=firebase.auth();
const db=firebase.database();
let currentUser=null;
let currentProfile=null;
let currentClub="KPFA";
let currentSection="";
let selectedCompetitionId=null;
const ADMIN_EMAIL="lathifafra@gmail.com";

function show(id){
  document.querySelectorAll("main > section").forEach(section=>section.classList.add("hidden"));
  const target=document.getElementById(id);
  if(target)target.classList.remove("hidden");
}
function showRegister(){show("register")}
function isAdmin(){
  return !!currentUser && currentUser.email===ADMIN_EMAIL;
}
function loginUser(){
  const email=document.getElementById("email").value.trim();
  const password=document.getElementById("password").value;
  document.getElementById("authMessage").textContent="Logging in...";
  auth.signInWithEmailAndPassword(email,password).catch(error=>{
    document.getElementById("authMessage").textContent=error.message;
  });
}
function registerUser(){
  const email=document.getElementById("regEmail").value.trim();
  const password=document.getElementById("regPassword").value;
  const message=document.getElementById("regMessage");
  if(password.length<6){message.textContent="Password must be at least 6 characters.";return;}
  const profile={
    club:document.getElementById("regClub").value,
    loftName:document.getElementById("loftName").value.trim(),
    ownerName:document.getElementById("ownerName").value.trim(),
    contactNumber:document.getElementById("contactNumber").value.trim(),
    areaName:document.getElementById("areaName").value.trim(),
    email:email,
    approved:false
  };
  message.textContent="Registering...";
  auth.createUserWithEmailAndPassword(email,password).then(credential=>{
    return db.ref("members/"+credential.user.uid).set(profile);
  }).then(()=>{
    message.textContent="Registration submitted. Wait for admin approval.";
  }).catch(error=>message.textContent=error.message);
}
function logoutUser(){auth.signOut()}
function goHome(){show("home")}
function goBack(){show("club")}
function openClub(club){
  currentClub=club;
  document.getElementById("clubTitle").textContent=club+" PIGEON CLUB";
  show("club");
}
function openSection(section){
  currentSection=section;
  document.getElementById("sectionTitle").textContent=section;
  show("details");
  loadRecords();
}
function showAdmin(){show("admin");loadPendingMembers()}
function loadPendingMembers(){
  const target=document.getElementById("pendingMembers");
  target.textContent="Loading...";
  db.ref("members").once("value").then(snapshot=>{
    target.innerHTML="";
    snapshot.forEach(child=>{
      const member=child.val()||{};
      if(member.approved) return;
      const item=document.createElement("div");
      item.className="item";
      item.textContent=(member.loftName||"")+"\n"+(member.email||"")+"\n"+(member.club||"");
      const button=document.createElement("button");
      button.textContent="APPROVE";
      button.onclick=()=>approveMember(child.key);
      item.appendChild(button);
      target.appendChild(item);
    });
  }).catch(error=>target.textContent=error.message);
}
function approveMember(uid){
  if(!isAdmin())return;
  db.ref("members/"+uid+"/approved").set(true).then(loadPendingMembers);
}
auth.onAuthStateChanged(user=>{
  currentUser=user;
  if(!user){currentProfile=null;show("login");return;}
  db.ref("members/"+user.uid).once("value").then(snapshot=>{
    currentProfile=snapshot.val();
    if(isAdmin()){
      document.getElementById("adminButton").classList.remove("hidden");
      document.getElementById("userEmail").textContent=user.email;
      show("home");
    }else if(!currentProfile||!currentProfile.approved){
      document.getElementById("pendingInfo").textContent=user.email;
      show("pending");
    }else{
      document.getElementById("userEmail").textContent=user.email;
      document.getElementById("memberInfo").textContent=(currentProfile.loftName||"")+" • "+(currentProfile.club||"");
      show("home");
    }
  }).catch(error=>{
    document.getElementById("authMessage").textContent=error.message;
  });
});
 function fillCompetitionForm(entry){
  document.getElementById("competitionDate").value=entry.date||"";
  document.getElementById("competitionDuration").value=entry.duration||"ONE DAY";
  document.getElementById("competitionType").value=entry.type||"KARNAM PIGEON";
  document.getElementById("competitionResult").value=entry.detail||"";
}

function loadCompetitionIntoForm(slot){
  if(!isAdmin())return;
  db.ref(competitionPath()).once("value").then(snapshot=>{
    let found=null;
    snapshot.forEach(child=>{
      const v=child.val()||{};
      if(v.competitionId===competitionId(slot))found=v;
    });
    fillCompetitionForm(found||defaultCompetition(slot));
  }).catch(error=>{
    document.getElementById("competitionMessage").textContent="Load failed: "+error.message;
  });
}

function editSelectedCompetition(){
  const form=document.getElementById("competitionAdmin");
  const message=document.getElementById("competitionMessage");
  const slotSelect=document.getElementById("competitionSlot");

  if(!auth||!auth.currentUser){
    alert("Please login again.");
    return;
  }
  if(!isAdmin()){
    alert("Admin login required. Please check your email.");
    return;
  }
  if(!form||!message||!slotSelect){
    alert("Admin form not found. Please check the app code.");
    return;
  }

  let slot=1;
  const match=String(selectedCompetitionId||"").match(/competition_(\d+)/);
  if(match)slot=Number(match[1]);
  else if(slotSelect.value)slot=Number(slotSelect.value);

  if(slot<1||slot>COMPETITION_COUNT){
    alert("Please select a valid competition.");
    return;
  }

  slotSelect.value=String(slot);
  form.classList.remove("hidden");
  message.textContent="Loading competition details...";
  loadCompetitionIntoForm(slot);

  setTimeout(function(){
    form.scrollIntoView({behavior:"smooth",block:"start"});
  },150);
}

function saveCompetition(){
  if(!isAdmin()){
    alert("Only Admin can save competition results.");
    return;
  }

  const slot=Number(document.getElementById("competitionSlot").value);
  const date=document.getElementById("competitionDate").value;
  const duration=document.getElementById("competitionDuration").value;
  const type=document.getElementById("competitionType").value;
  const detail=document.getElementById("competitionResult").value.trim();
  const msg=document.getElementById("competitionMessage");

  if(!slot||slot<1||slot>COMPETITION_COUNT||!date||!detail){
    msg.textContent="Select competition and enter date and complete result.";
    return;
  }

  const id=competitionId(slot);
  const payload={
    competitionId:id,
    date,
    duration,
    type,
    detail,
    updatedAt:Date.now(),
    updatedBy:auth.currentUser.email||""
  };

  msg.textContent="Saving...";
  const ref=db.ref(competitionPath());

  ref.once("value").then(snapshot=>{
    let key=null;
    snapshot.forEach(child=>{
      if((child.val()||{}).competitionId===id)key=child.key;
    });
    return (key?ref.child(key):ref.push()).set(payload);
  }).then(()=>{
    msg.textContent="Competition "+String(slot).padStart(2,"0")+" saved successfully!";
    selectedCompetitionId=id;
    loadCompetitions();
    openCompetition(slot,payload);
  }).catch(error=>{
    msg.textContent="Save failed: "+error.message;
  });
}

function renderCompetitionResult(rawText){
  const target=document.getElementById("competitionDetailText");
  target.replaceChildren();

  const normalized=String(rawText||"RESULT NOT ADDED YET")
    .replace(/\s+(?=RANK\s*\d+)/gi,"\n");

  const lines=normalized.split(/\n+/).map(line=>line.trim()).filter(Boolean);
  if(!lines.length)lines.push("RESULT NOT ADDED YET");

  let rankCount=0;
  lines.forEach(line=>{
    const match=line.match(/^RANK\s*(\d+)\s*[:.-]?\s*(.*)$/i);
    const card=document.createElement("div");
    card.className="rank-card";

    const label=document.createElement("div");
    label.className="rank-label";

    const detail=document.createElement("div");
    detail.className="rank-detail";

    if(match){
      label.textContent=(Number(match[1])===1?"🥇":Number(match[1])===2?"🥈":Number(match[1])===3?"🥉":"🏅")+" RANK "+match[1];
      detail.textContent=match[2]||"";
      rankCount++;
    }else if(/^RESULT NOT ADDED YET$/i.test(line)){
      label.textContent="🏆 RESULT";
      detail.textContent=line;
    }else{
      label.textContent=rankCount===0?"🏆 RESULT DETAILS":"";
      detail.textContent=line;
    }

    if(label.textContent)card.appendChild(label);
    card.appendChild(detail);
    target.appendChild(card);
  });
}

function closeCompetition(){
  const detail=document.getElementById("competitionDetail");
  detail.classList.add("hidden");
  detail.classList.remove("popup-open");
}

function goHome(){
  if(isAdmin()||(currentProfile&&currentProfile.status==="approved"))show("home");
  else show("pending");
}

function backToClub(){
  show("club");
}

initializeFirebase();
</script>
</body>
</html>
