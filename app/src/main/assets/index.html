<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KPFA CPUC Pigeon App</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#101b35;color:#fff}header{background:#172b50;padding:16px;text-align:center;border-bottom:3px solid #dcae45}h1,h2{color:#f5cf70}main{max-width:650px;margin:auto;padding:14px}.panel{background:#1b2b4b;padding:16px;border-radius:14px;margin:12px 0}input,select,textarea,button{width:100%;padding:12px;margin:6px 0;border-radius:8px;font-size:16px}input,select,textarea{background:white;color:#111;border:1px solid #7183a4}button{background:#dcae45;color:#17213b;border:0;font-weight:bold}.secondary{background:#344766;color:#fff}.hidden{display:none!important}.small{font-size:13px;color:#d6dff0}.item{background:#253b60;padding:12px;border-radius:8px;margin:8px 0;white-space:pre-wrap;overflow-wrap:anywhere}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.grid button{min-height:110px;white-space:pre-line}.danger{background:#a33;color:#fff}.rank-card{background:linear-gradient(135deg,#253b60,#172b50);border:1px solid #dcae45;border-radius:12px;padding:13px;margin:8px 0;white-space:pre-wrap;line-height:1.65}.rank-title{font-weight:bold;color:#f5cf70;font-size:18px;margin-bottom:6px}.edit-actions{position:sticky;bottom:0;background:#1b2b4b;padding:8px;border-top:1px solid #dcae45}</style></head><body><header><label id="langLabel">Language / மொழி</label><select id="lang" style="width:auto" onchange="setLang(this.value)"><option value="en">English</option><option value="ta">தமிழ்</option></select><h1>KPFA • CPUC</h1><div>Karumbukkadai Pigeon Friends Association</div></header><main>
<section id="login" class="panel"><h2 data-en="Member Login" data-ta="உறுப்பினர் உள்நுழைவு">Member Login</h2><input id="email" type="email" placeholder="Email address"><input id="password" type="password" placeholder="Password"><button onclick="loginUser()" data-en="Login" data-ta="உள்நுழை">Login</button><button class="secondary" onclick="show('register')" data-en="Create Account" data-ta="புதிய கணக்கு">Create Account</button><p id="authMessage" class="small"></p></section>
<section id="register" class="panel hidden"><h2 data-en="Register" data-ta="பதிவு செய்">Register</h2><select id="regClub"><option value="KPFA">KPFA - Local</option><option value="CPUC">CPUC - District Level</option></select><input id="loftName" placeholder="Loft Name"><input id="ownerName" placeholder="Loft Owner"><input id="contactNumber" placeholder="Contact Number"><input id="areaName" placeholder="Place / Area"><input id="regEmail" type="email" placeholder="Email address"><input id="regPassword" type="password" placeholder="Password (minimum 6 characters)"><button onclick="registerUser()">Register</button><button class="secondary" onclick="show('login')">Back to Login</button><p id="regMessage" class="small"></p></section>
<section id="pending" class="panel hidden"><h2>Pending Approval / ஒப்புதல் நிலுவையில்</h2><p id="pendingInfo"></p><button class="secondary" onclick="logoutUser()">Logout</button></section>
<section id="home" class="panel hidden"><h2 data-en="Welcome" data-ta="வரவேற்கிறோம்">Welcome</h2><p id="userEmail" class="small"></p><p id="memberInfo" class="small"></p><button onclick="openClub('KPFA')">KPFA - Local</button><button onclick="openClub('CPUC')">CPUC - District Level</button><button onclick="openAnnouncements()" data-en="Announcements" data-ta="அறிவிப்புகள்">Announcements</button><button id="adminButton" class="hidden" onclick="showAdmin()">Admin Approval</button><button class="secondary" onclick="logoutUser()">Logout</button></section>
<section id="admin" class="panel hidden"><h2>Admin Approval / நிர்வாகி ஒப்புதல்</h2><div id="pendingMembers"></div><button class="secondary" onclick="loadPendingMembers()">Refresh</button><button class="secondary" onclick="show('home')">Back</button></section>
<section id="club" class="panel hidden"><h2 id="clubTitle"></h2><button onclick="openSection('Competition Results')">COMPLETE RESULT</button><button onclick="openSection('Race Details')">Race Details</button><button onclick="openSection('Participants')">Participants</button><button onclick="openSection('Championship')">Championship</button><button onclick="openAnnouncements()">Announcements / அறிவிப்புகள்</button><button class="secondary" onclick="show('home')">Back</button></section>
<section id="announcements" class="panel hidden"><h2>Announcements / அறிவிப்புகள்</h2><p class="small">தமிழ் + English</p><div id="announcementAdmin" class="hidden"><label>Club / சங்கம்</label><select id="annClub"><option value="KPFA">KPFA</option><option value="CPUC">CPUC</option><option value="BOTH">Both / இரண்டும்</option></select><input id="annTitleEn" placeholder="Title (English)"><textarea id="annBodyEn" rows="3" placeholder="Message (English)"></textarea><input id="annTitleTa" placeholder="தலைப்பு (தமிழ்)"><textarea id="annBodyTa" rows="3" placeholder="செய்தி (தமிழ்)"></textarea><button onclick="saveAnnouncement()">Publish / வெளியிடு</button><button class="secondary" onclick="shareAnnouncementDraft()">Share Draft on WhatsApp / WhatsApp-ல் பகிர்</button><button onclick="publishAndShareAnnouncement()">Publish + Share on WhatsApp / வெளியிட்டு WhatsApp-ல் பகிர்</button><p id="annMsg" class="small"></p></div><div id="annList"></div><button class="secondary" onclick="show(lastPage)">Back</button></section>
<section id="details" class="panel hidden"><h2 id="sectionTitle"></h2><div id="legacyEditor"><input id="recordTitle" placeholder="Title / Race / Participant name"><textarea id="recordText" rows="4" placeholder="Enter result, timing, points or details"></textarea><button onclick="saveRecord()">Save Online</button><button class="secondary" onclick="loadRecords()">Refresh Records</button></div><div id="competitionAdmin" class="hidden"><h3>ADMIN - ADD / UPDATE COMPETITION</h3><select id="competitionSlot"></select><label>Date</label><input id="competitionDate" type="date"><label>Duration</label><select id="competitionDuration"><option>ONE DAY</option><option>TWO DAYS</option><option>THREE DAYS</option><option>SEVEN DAYS</option></select><label>Pigeon Type</label><select id="competitionType"><option>KARNAM PIGEON</option><option>HY FLYER PIGEON</option></select><textarea id="competitionResult" rows="8" placeholder="RANK 1&#10;LOFT NAME:&#10;BIRDS FLYING TIME:&#10;TOTAL FLYING TIME:"></textarea><button onclick="saveCompetition()">SAVE / UPDATE COMPETITION</button><p id="competitionMessage" class="small"></p></div><div id="competitionGrid" class="grid"></div><div id="records"></div><button class="secondary" onclick="show('club')">Back to Club</button><p id="saveMessage" class="small"></p></section></main>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script><script>
const firebaseConfig={apiKey:"AIzaSyD9_4Fq2UpnVmYf8J7ERswACoFM-YiTexk",authDomain:"kpfa-cpuc.firebaseapp.com",databaseURL:"https://kpfa-cpuc-default-rtdb.asia-southeast1.firebasedatabase.app",projectId:"kpfa-cpuc",storageBucket:"kpfa-cpuc.firebasestorage.app",messagingSenderId:"445696991705",appId:"1:445696991705:web:076102fbe42afa2c7239c8"};const ADMIN_EMAIL="lathifafra@gmail.com",COMPETITION_COUNT=13;let auth,db,currentClub="KPFA",currentSection="Competition Results",currentProfile=null,lastPage="home";
function setLang(l){localStorage.setItem('kpfaLang',l);document.documentElement.lang=l;document.querySelectorAll('[data-en]').forEach(e=>e.textContent=e.dataset[l]||e.dataset.en);document.getElementById('langLabel').textContent=l==='ta'?'மொழி / Language':'Language / மொழி';const map={en:{'KPFA - Local':'KPFA - Local','CPUC - District Level':'CPUC - District Level','COMPLETE RESULT':'COMPLETE RESULT','Race Details':'Race Details','Participants':'Participants','Championship':'Championship','Admin Approval':'Admin Approval','Logout':'Logout','Back to Club':'Back to Club','Refresh':'Refresh','Refresh Records':'Refresh Records','Save Online':'Save Online','SAVE / UPDATE COMPETITION':'SAVE / UPDATE COMPETITION','EDIT RESULT':'EDIT RESULT','Share to WhatsApp':'Share to WhatsApp','Delete':'Delete','Approve Member':'Approve Member','Date':'Date','Duration':'Duration','Pigeon Type':'Pigeon Type'},ta:{'KPFA - Local':'KPFA - உள்ளூர்','CPUC - District Level':'CPUC - மாவட்ட நிலை','COMPLETE RESULT':'முழு போட்டி முடிவுகள்','Race Details':'போட்டி விவரங்கள்','Participants':'பங்கேற்பாளர்கள்','Championship':'சாம்பியன்ஷிப்','Admin Approval':'நிர்வாகி ஒப்புதல்','Logout':'வெளியேறு','Back to Club':'சங்கத்திற்குத் திரும்பு','Refresh':'புதுப்பி','Refresh Records':'பதிவுகளைப் புதுப்பி','Save Online':'ஆன்லைனில் சேமி','SAVE / UPDATE COMPETITION':'போட்டியைச் சேமி / மாற்று','EDIT RESULT':'முடிவைத் திருத்து','Share to WhatsApp':'WhatsApp-ல் பகிர்','Delete':'நீக்கு','Approve Member':'உறுப்பினரை ஏற்கவும்','Date':'தேதி','Duration':'கால அளவு','Pigeon Type':'புறா வகை'}};document.querySelectorAll('button,label').forEach(e=>{if(!e.dataset.originalText)e.dataset.originalText=e.textContent.trim();let original=e.dataset.originalText;e.textContent=(map[l]&&map[l][original])||original});document.querySelectorAll('input[placeholder],textarea[placeholder]').forEach(e=>{if(!e.dataset.originalPlaceholder)e.dataset.originalPlaceholder=e.placeholder;const ph=e.dataset.originalPlaceholder;const tm={'Email address':'மின்னஞ்சல் முகவரி','Password':'கடவுச்சொல்','Loft Name':'லாஃப்ட் பெயர்','Loft Owner':'லாஃப்ட் உரிமையாளர்','Contact Number':'தொடர்பு எண்','Place / Area':'இடம் / பகுதி','Title (English)':'தலைப்பு (ஆங்கிலம்)','Message (English)':'செய்தி (ஆங்கிலம்)','தலைப்பு (தமிழ்)':'தலைப்பு (தமிழ்)','செய்தி (தமிழ்)':'செய்தி (தமிழ்)','Title / Race / Participant name':'தலைப்பு / போட்டி / பங்கேற்பாளர் பெயர்','Enter result, timing, points or details':'முடிவு, நேரம், புள்ளிகள் அல்லது விவரங்களை உள்ளிடவும்','RANK 1\nLOFT NAME:\nBIRDS FLYING TIME:\nTOTAL FLYING TIME:':'ரேங்க் 1\nலாஃப்ட் பெயர்:\nபறந்த நேரம்:\nமொத்த பறந்த நேரம்:'};e.placeholder=l==='ta'?(tm[ph]||ph):ph})}function show(id){['login','register','pending','home','admin','club','announcements','details'].forEach(x=>document.getElementById(x).classList.toggle('hidden',x!==id))}function isAdmin(){return !!(auth&&auth.currentUser&&auth.currentUser.email&&auth.currentUser.email.toLowerCase()===ADMIN_EMAIL.toLowerCase())}function init(){try{if(!firebase.apps.length)firebase.initializeApp(firebaseConfig);auth=firebase.auth();db=firebase.database();auth.onAuthStateChanged(handleAuth);const s=document.getElementById('competitionSlot');for(let i=1;i<=COMPETITION_COUNT;i++){let o=document.createElement('option');o.value=i;o.textContent='COMPETITION '+String(i).padStart(2,'0');s.append(o)}}catch(e){document.getElementById('authMessage').textContent=e.message}}function loginUser(){if(!auth)return init();let e=email.value.trim(),p=password.value;if(!e||!p){authMessage.textContent='Enter email and password';return}auth.signInWithEmailAndPassword(e,p).catch(x=>authMessage.textContent=x.message)}function registerUser(){if(!auth)return;let club=regClub.value,loftNameV=loftName.value.trim(),ownerNameV=ownerName.value.trim(),contactNumberV=contactNumber.value.trim(),areaNameV=areaName.value.trim(),emailV=regEmail.value.trim(),passwordV=regPassword.value;if(!loftNameV||!ownerNameV||!contactNumberV||!areaNameV||!emailV||passwordV.length<6){regMessage.textContent='Fill all fields; password minimum 6 characters.';return}auth.createUserWithEmailAndPassword(emailV,passwordV).then(c=>db.ref('members/'+c.user.uid).set({club,loftName:loftNameV,ownerName:ownerNameV,contactNumber:contactNumberV,areaName:areaNameV,email:emailV,status:'pending',role:'member',createdAt:Date.now()}).then(()=>regMessage.textContent='Registered. Waiting for Admin approval.')).catch(e=>regMessage.textContent=e.message)}function handleAuth(u){if(!u){currentProfile=null;show('login');return}if(u.email&&u.email.toLowerCase()===ADMIN_EMAIL.toLowerCase()){userEmail.textContent=u.email;memberInfo.textContent='Administrator';adminButton.classList.remove('hidden');show('home');return}db.ref('members/'+u.uid).once('value').then(s=>{if(!s.exists()){show('pending');pendingInfo.textContent='Profile not found. Contact Admin.';return}currentProfile=s.val();if(currentProfile.status!=='approved'){show('pending');pendingInfo.textContent='Club: '+currentProfile.club+' | Loft: '+currentProfile.loftName;return}userEmail.textContent=u.email||'';memberInfo.textContent=currentProfile.club+' | '+currentProfile.loftName+' | '+currentProfile.areaName;adminButton.classList.add('hidden');show('home')}).catch(e=>{show('pending');pendingInfo.textContent=e.message})}function logoutUser(){auth&&auth.signOut()}function showAdmin(){if(!isAdmin())return;show('admin');loadPendingMembers()}function loadPendingMembers(){if(!isAdmin())return;pendingMembers.textContent='Loading...';db.ref('members').once('value').then(s=>{pendingMembers.replaceChildren();let n=0;s.forEach(c=>{let m=c.val()||{};if(m.status!=='pending')return;n++;let d=document.createElement('div');d.className='item';d.textContent=`${m.club||''}\n${m.loftName||''}\n${m.ownerName||''}\n${m.contactNumber||''}\n${m.areaName||''}\n${m.email||''}`;let b=document.createElement('button');b.textContent='Approve Member';b.onclick=()=>db.ref('members/'+c.key+'/status').set('approved').then(loadPendingMembers);d.append(b);pendingMembers.append(d)});if(!n)pendingMembers.textContent='No pending registrations.'})}function canAccess(c){return isAdmin()||(currentProfile&&currentProfile.status==='approved'&&currentProfile.club===c)}function openClub(c){if(!canAccess(c)){alert('Admin approval is required for this club.');return}currentClub=c;clubTitle.textContent=c==='KPFA'?'KPFA - Local':'CPUC - District Level';show('club')}function openSection(s){if(!canAccess(currentClub)){alert('Admin approval required');return}currentSection=s;sectionTitle.textContent=currentClub+' - '+s;let res=s==='Competition Results';legacyEditor.classList.toggle('hidden',res||!isAdmin());competitionAdmin.classList.toggle('hidden',!res||!isAdmin());competitionGrid.classList.toggle('hidden',!res);records.textContent='';show('details');res?loadCompetitions():loadRecords()}function recordPath(){return 'clubs/'+currentClub+'/'+currentSection.replace(/\s+/g,'_')}function saveRecord(){if(!isAdmin())return;let title=recordTitle.value.trim(),detail=recordText.value.trim();if(!title||!detail){saveMessage.textContent='Enter title and details';return}db.ref(recordPath()).push({title,detail,createdAt:Date.now(),createdBy:auth.currentUser.email}).then(()=>{saveMessage.textContent='Saved online';recordTitle.value='';recordText.value='';loadRecords()}).catch(e=>saveMessage.textContent=e.message)}function loadRecords(){db.ref(recordPath()).once('value').then(s=>{records.replaceChildren();if(!s.exists()){records.textContent='No records yet';return}s.forEach(c=>{let r=c.val()||{},d=document.createElement('div');d.className='item';d.textContent=(r.title||'Record')+'\n'+(r.detail||'');records.append(d)})}).catch(e=>records.textContent=e.message)}function compPath(){return 'clubs/'+currentClub+'/Competition_Results'}function compId(i){return 'competition_'+String(i).padStart(2,'0')}function loadCompetitions(){if(!canAccess(currentClub))return;db.ref(compPath()).once('value').then(s=>{let all={};s.forEach(c=>{let v=c.val()||{};if(v.competitionId)all[v.competitionId]={...v,_key:c.key}});competitionGrid.replaceChildren();for(let i=1;i<=COMPETITION_COUNT;i++){let e=all[compId(i)]||{},b=document.createElement('button');b.textContent='🏆\nCOMPETITION '+String(i).padStart(2,'0')+'\n'+(e.date?e.date.split('-').reverse().join('.'):'DATE NOT SET')+'\n'+(e.duration||'ONE DAY')+'\n'+(e.type||'KARNAM PIGEON');b.onclick=()=>showCompetitionResult(i,e);competitionGrid.append(b)}}).catch(e=>competitionGrid.textContent='Unable to load competitions: '+e.message)}function showCompetitionResult(i,e){records.replaceChildren();let heading=document.createElement('h3');heading.textContent='COMPETITION '+String(i).padStart(2,'0')+' — '+(e.date||'DATE NOT SET');records.append(heading);let raw=(e&&e.detail)||'';if(!raw.trim()){let empty=document.createElement('div');empty.className='item';empty.textContent='No result entered yet / இன்னும் முடிவு பதிவு செய்யப்படவில்லை';records.append(empty)}else{let chunks=raw.split(/(?=RANK\s*[:#-]?\s*\d+|ரேங்க்\s*[:#-]?\s*\d+)/i).filter(x=>x.trim());if(chunks.length===0)chunks=[raw];chunks.forEach((part,index)=>{let card=document.createElement('div');card.className='rank-card';let lines=part.trim().split('\n');let title=document.createElement('div');title.className='rank-title';title.textContent=(lines.shift()||('RANK '+(index+1))).trim();let body=document.createElement('div');body.textContent=lines.join('\n').trim();card.append(title,body);records.append(card)})}if(isAdmin()){let wrap=document.createElement('div');wrap.className='edit-actions';let ed=document.createElement('button');ed.textContent='EDIT RESULT (ADMIN) / முடிவைத் திருத்து';ed.onclick=()=>{if(!isAdmin()){alert('Admin only');return}competitionSlot.value=String(i);competitionDate.value=e.date||'';competitionDuration.value=e.duration||'ONE DAY';competitionType.value=e.type||'KARNAM PIGEON';competitionResult.value=e.detail||'';competitionAdmin.classList.remove('hidden');show('details');competitionAdmin.scrollIntoView({behavior:'smooth',block:'start'});competitionMessage.textContent='Editing Competition '+String(i).padStart(2,'0')+' — Save / Update after changes.'};wrap.append(ed);records.append(wrap)}}function saveCompetition(){if(!isAdmin())return;let i=Number(competitionSlot.value),id=compId(i),data={competitionId:id,date:competitionDate.value,duration:competitionDuration.value,type:competitionType.value,detail:competitionResult.value.trim(),updatedAt:Date.now(),updatedBy:auth.currentUser.email};if(!data.date){competitionMessage.textContent='Choose date';return}db.ref(compPath()).once('value').then(s=>{let key=null;s.forEach(c=>{if((c.val()||{}).competitionId===id)key=c.key});return key?db.ref(compPath()+'/'+key).update(data):db.ref(compPath()).push(data)}).then(()=>{competitionMessage.textContent='Saved / Updated successfully / வெற்றிகரமாக சேமிக்கப்பட்டது';loadCompetitions()}).catch(e=>competitionMessage.textContent=e.message)}
function openAnnouncements(){if(!auth||!auth.currentUser){alert('Please login');return}lastPage=document.getElementById('club').classList.contains('hidden')?'home':'club';announcementAdmin.classList.toggle('hidden',!isAdmin());if(!isAdmin()&&currentProfile)annClub.value=currentProfile.club;show('announcements');loadAnnouncements()}function announcementDraft(){return {club:annClub.value,titleEn:annTitleEn.value.trim(),bodyEn:annBodyEn.value.trim(),titleTa:annTitleTa.value.trim(),bodyTa:annBodyTa.value.trim()}}function announcementMessage(a){let clubLabel=a.club==='BOTH'?'KPFA • CPUC':a.club;return ['🕊️ KPFA • CPUC PIGEON APP',clubLabel+' ANNOUNCEMENT','',a.titleEn,a.bodyEn,a.titleTa,a.bodyTa,'','Karumbukkadai Pigeon Friends Association'].filter(Boolean).join('\n')}function shareTextToWhatsApp(message){const url='https://api.whatsapp.com/send?text='+encodeURIComponent(message);const w=window.open(url,'_blank');if(!w){window.location.href=url}}function shareAnnouncementDraft(){if(!isAdmin()){alert('Admin only');return}const a=announcementDraft();if(!(a.titleEn||a.titleTa)||!(a.bodyEn||a.bodyTa)){annMsg.textContent='Enter a title and message before sharing.';return}shareTextToWhatsApp(announcementMessage(a))}function publishAndShareAnnouncement(){if(!isAdmin())return;const a=announcementDraft();if(!(a.titleEn||a.titleTa)||!(a.bodyEn||a.bodyTa)){annMsg.textContent='Enter a title and message in Tamil and/or English';return}const waWindow=window.open('about:blank','_blank');const data={...a,createdAt:Date.now(),createdBy:auth.currentUser.email};db.ref('announcements').push(data).then(()=>{annMsg.textContent='Published successfully. Opening WhatsApp...';annTitleEn.value=annBodyEn.value=annTitleTa.value=annBodyTa.value='';loadAnnouncements();const url='https://api.whatsapp.com/send?text='+encodeURIComponent(announcementMessage(a));if(waWindow){waWindow.location.href=url}else{window.location.href=url}}).catch(e=>{if(waWindow)waWindow.close();annMsg.textContent='Publish failed: '+e.message})}function saveAnnouncement(){if(!isAdmin())return;let data={...announcementDraft(),createdAt:Date.now(),createdBy:auth.currentUser.email};if(!(data.titleEn||data.titleTa)||!(data.bodyEn||data.bodyTa)){annMsg.textContent='Enter title and message in Tamil and/or English';return}db.ref('announcements').push(data).then(()=>{annMsg.textContent='Published / வெளியிடப்பட்டது';annTitleEn.value=annBodyEn.value=annTitleTa.value=annBodyTa.value='';loadAnnouncements()}).catch(e=>annMsg.textContent=e.message)}function loadAnnouncements(){annList.textContent='Loading...';db.ref('announcements').once('value').then(s=>{annList.replaceChildren();let arr=[];s.forEach(c=>{let a=c.val()||{};if(a.club==='BOTH'||a.club===currentClub||(currentProfile&&a.club===currentProfile.club))arr.push({...a,key:c.key})});arr.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));if(!arr.length){annList.textContent='No announcements yet';return}arr.forEach(a=>{let d=document.createElement('div');d.className='item';let h=document.createElement('h3');h.textContent=[a.titleTa,a.titleEn].filter(Boolean).join(' / ');let p=document.createElement('p');p.textContent=[a.bodyTa,a.bodyEn].filter(Boolean).join('\n\n');let share=document.createElement('button');share.textContent='Share to WhatsApp';share.onclick=()=>window.open('https://wa.me/?text='+encodeURIComponent([a.titleTa,a.bodyTa,a.titleEn,a.bodyEn].filter(Boolean).join('\n\n')),'_blank');d.append(h,p,share);if(isAdmin()){let del=document.createElement('button');del.className='danger';del.textContent='Delete';del.onclick=()=>{if(confirm('Delete announcement?'))db.ref('announcements/'+a.key).remove().then(loadAnnouncements)};d.append(del)}annList.append(d)})}).catch(e=>annList.textContent=e.message)}document.addEventListener('DOMContentLoaded',()=>{setLang(localStorage.getItem('kpfaLang')||'en');init()});
</script></body></html>
