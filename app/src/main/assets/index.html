<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KPFA CPUC Pigeon App</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#07152e;
  color:white;
}
.header{
  text-align:center;
  padding:25px 10px;
  background:#101f40;
  border-bottom:3px solid #d4af37;
}
.logo{font-size:45px}
h1{color:#ffd966;margin:8px 0;font-size:27px}
.subtitle{color:#fff;font-size:13px;letter-spacing:2px}
.container{padding:22px;max-width:420px;margin:auto}
.panel{
  background:#132747;
  padding:24px;
  border-radius:18px;
  border:1px solid #c9a43b;
  box-shadow:0 5px 18px #0005;
}
h2{text-align:center;color:#ffd966;margin-top:0}
label{display:block;margin:16px 0 7px}
input{
  width:100%;
  padding:13px;
  border-radius:9px;
  border:1px solid #c9a43b;
  background:#07152e;
  color:white;
  font-size:16px;
}
button{
  width:100%;
  padding:14px;
  margin-top:20px;
  border:0;
  border-radius:9px;
  background:#d4af37;
  color:#07152e;
  font-size:17px;
  font-weight:bold;
}
.message{text-align:center;margin-top:15px;color:#ffd966}
.cards{display:none}
.card{
  padding:22px;
  margin:18px 0;
  text-align:center;
  border:2px solid #d4af37;
  border-radius:15px;
  background:#132747;
}
.card h2{font-size:24px}
.back{background:#fff;color:#07152e}
.note{text-align:center;font-size:12px;color:#c5cce0;margin-top:20px}
</style>
</head>

<body>
<div class="header">
  <div class="logo">🐦</div>
  <h1>KPFA • CPUC</h1>
  <div class="subtitle">PIGEON FRIENDS ASSOCIATION</div>
</div>

<div class="container">

  <div class="panel" id="loginPage">
    <h2>🔐 LOGIN</h2>

    <label for="username">Login ID</label>
    <input id="username" type="text" placeholder="Enter Login ID">

    <label for="password">Password</label>
    <input id="password" type="password" placeholder="Enter Password">

    <label>
      <input type="checkbox" id="showPassword"
        style="width:auto;margin-right:8px">
      Show Password
    </label>

    <button onclick="login()">LOGIN</button>
    <div class="message" id="message"></div>
    <div class="note">KPFA • CPUC Pigeon App</div>
  </div>

  <div class="cards" id="homePage">
    <div class="card" onclick="openClub('KPFA')">
      <h2>🐦 KPFA</h2>
      <p>Karumbukkadai Pigeon Friends Association</p>
      <button>OPEN KPFA</button>
    </div>

    <div class="card" onclick="openClub('CPUC')">
      <h2>🐦 CPUC</h2>
      <p>Coimbatore Pigeon Unity Welfare Association</p>
      <button>OPEN CPUC</button>
    </div>

    <div class="panel" id="clubPage" style="display:none">
      <h2 id="clubTitle"></h2>
      <p style="text-align:center">Welcome to Pigeon App!</p>
      <button class="back" onclick="goHome()">BACK</button>
    </div>

    <button class="back" onclick="logout()">LOGOUT</button>
  </div>

</div>

<script>
document.getElementById("showPassword").addEventListener("change",function(){
  document.getElementById("password").type=this.checked?"text":"password";
});

function login(){
  var u=document.getElementById("username").value.trim();
  var p=document.getElementById("password").value;
  if((u==="admin"&&p==="admin123")||(u==="member"&&p==="member123")){
    document.getElementById("loginPage").style.display="none";
    document.getElementById("homePage").style.display="block";
    document.getElementById("message").innerText="";
  }else{
    document.getElementById("message").innerText="Incorrect Login ID or Password";
  }
}

function openClub(club){
  document.getElementById("clubPage").style.display="block";
  document.getElementById("clubTitle").innerText=club;
}

function goHome(){
  document.getElementById("clubPage").style.display="none";
}

function logout(){
  document.getElementById("homePage").style.display="none";
  document.getElementById("clubPage").style.display="none";
  document.getElementById("loginPage").style.display="block";
  document.getElementById("username").value="";
  document.getElementById("password").value="";
}

document.getElementById("password").addEventListener("keydown",function(e){
  if(e.key==="Enter")login();
});
</script>
</body>
</html>
