<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KPFA CPUC Pigeon App</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#101b35;color:#fff}
header{background:#172b50;padding:20px;text-align:center;border-bottom:3px solid #dcae45}
h1{color:#f5cf70;font-size:23px;margin:0 0 8px}
h2{color:#f5cf70}
main{max-width:600px;margin:auto;padding:18px}
.panel{background:#1b2b4b;padding:18px;border-radius:14px;margin:14px 0}
input,select,textarea,button{width:100%;padding:12px;margin:7px 0;border-radius:8px;font-size:16px}
input,select,textarea{border:1px solid #7183a4;background:#fff;color:#111}
button{border:0;background:#dcae45;color:#17213b;font-weight:bold;cursor:pointer}
.secondary{background:#344766;color:white}
.item{background:#253b60;padding:12px;border-radius:8px;margin:8px 0;overflow-wrap:anywhere}
.small{font-size:13px;color:#d6dff0}
.hidden{display:none}
#authMessage,#saveMessage{overflow-wrap:anywhere}
</style>
</head>
<body>
<header>
<h1>KPFA • CPUC</h1>
<div>Karumbukkadai Pigeon Friends Association</div>
</header>

<main>
<section id="login" class="panel">
<h2>Member Login</h2>
<input id="email" type="email" placeholder="Email address" autocomplete="email">
<input id="password" type="password" placeholder="Password" autocomplete="current-password">
<button onclick="loginUser()">Login</button>
<button class="secondary" onclick="showRegister()">Create Account</button>
<p id="authMessage" class="small" role="status"></p>
</section>

<section id="register" class="panel hidden">
<h2>Register</h2>
<label for="regClub">Club</label>
<select id="regClub">
<option value="KPFA">KPFA - Local</option>
<option value="CPUC">CPUC - District Level</option>
</select>
<input id="loftName" placeholder="Loft Name" autocomplete="organization">
<input id="ownerName" placeholder="Loft Owner" autocomplete="name">
<input id="contactNumber" type="tel" placeholder="Contact Number" autocomplete="tel">
<input id="areaName" placeholder="Place / Area" autocomplete="address-level2">
<input id="regEmail" type="email" placeholder="Email address" autocomplete="email">
<input id="regPassword" type="password" placeholder="Password (minimum 6 characters)" autocomplete="new-password">
<button onclick="registerUser()">Register</button>
<button class="secondary" onclick="show('login')">Back to Login</button>
<p id="regMessage" class="small" role="status"></p>
</section>

<section id="pending" class="panel hidden">
<h2>Pending Approval</h2>
<p>Your registration has been submitted.</p>
<p>Please wait for Admin approval.</p>
<p id="pendingInfo" class="small"></p>
<button class="secondary" onclick="logoutUser()">Logout</button>
</section>

<section id="admin" class="panel hidden">
<h2>Admin Approval</h2>
<p class="small">Pending member registrations</p>
<div id="pendingMembers">Loading...</div>
<button class="secondary" onclick="loadPendingMembers()">Refresh Requests</button>
<button class="secondary" onclick="logoutUser()">Logout</button>
</section>

<section id="home" class="hidden">
<div class="panel">
<h2>Welcome</h2>
<p id="userEmail" class="small"></p>
<p id="memberInfo" class="small"></p>
<button onclick="openClub('KPFA')">KPFA - Local</button>
<button onclick="openClub('CPUC')">CPUC - District Level</button>
<button id="adminButton" class="hidden" onclick="showAdmin()">Admin Approval</button>
<button class="secondary" onclick="logoutUser()">Logout</button>
</div>
</section>

<section id="club" class="hidden">
<div class="panel">
<h2 id="clubTitle"></h2>
<button onclick="openSection('Competition Results')">Competition Results</button>
<button onclick="openSection('Race Details')">Race Details</button>
<button onclick="openSection('Participants')">Participants</button>
<button onclick="openSection('Championship')">Championship</button>
<button class="secondary" onclick="goHome()">Back</button>
</div>
</section>

<section id="details" class="hidden">
<div class="panel">
<h2 id="sectionTitle"></h2>
<input id="recordTitle" placeholder="Title / Race / Participant name">
<textarea id="recordText" rows="4" placeholder="Enter result, timing, points or details"></textarea>
<button onclick="saveRecord()">Save Online</button>
<button class="secondary" onclick="loadRecords()">Refresh Records</button>
<button class="secondary" onclick="backToClub()">Back</button>
<p id="saveMessage" class="small" role="status"></p>
</div>
<div class="panel">
<h2>Saved Records</h2>
<div id="records">Sign in to view records.</div>
</div>
</section>
</main>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyD9_4Fq2UpnVmYf8J7ERswACoFM-YiTexk",
  authDomain: "kpfa-cpuc.firebaseapp.com",
  databaseURL: "https://kpfa-cpuc-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "kpfa-cpuc",
  storageBucket: "kpfa-cpuc.firebasestorage.app",
  messagingSenderId: "445696991705",
  appId: "1:445696991705:web:076102fbe42afa2c7239c8"
};

const ADMIN_EMAIL = "lathifafra@gmail.com";
let auth = null;
let db = null;
let currentClub = "KPFA";
let currentSection = "Competition Results";
let currentProfile = null;
let authListenerStarted = false;

function show(id){
  ["login","register","pending","admin","home","club","details"].forEach(x=>{
    document.getElementById(x).classList.toggle("hidden",x!==id);
  });
}

function isAdmin(){
  return !!(auth && auth.currentUser &&
    auth.currentUser.email &&
    auth.currentUser.email.toLowerCase() === ADMIN_EMAIL.toLowerCase());
}

function initializeFirebase(){
  try{
    if(typeof firebase === "undefined"){
      document.getElementById("authMessage").textContent =
        "Firebase SDK did not load. Check internet connection.";
      return false;
    }
    if(!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    auth = firebase.auth();
    db = firebase.database();
    if(!authListenerStarted){
      authListenerStarted = true;
      auth.onAuthStateChanged(handleAuthState);
    }
    return true;
  }catch(error){
    document.getElementById("authMessage").textContent =
      "Firebase setup error: "+error.message;
    return false;
  }
}

function showRegister(){
  document.getElementById("regMessage").textContent = "";
  show("register");
}

function loginUser(){
  if(!auth && !initializeFirebase()) return;
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  if(!email || !password){
    document.getElementById("authMessage").textContent =
      "Please enter email and password.";
    return;
  }
  document.getElementById("authMessage").textContent = "Logging in...";
  auth.signInWithEmailAndPassword(email,password).catch(error=>{
    document.getElementById("authMessage").textContent =
      "Login error: "+error.message;
  });
}

function registerUser(){
  if(!auth && !initializeFirebase()) return;

  const club = document.getElementById("regClub").value;
  const loftName = document.getElementById("loftName").value.trim();
  const ownerName = document.getElementById("ownerName").value.trim();
  const contactNumber = document.getElementById("contactNumber").value.trim();
  const areaName = document.getElementById("areaName").value.trim();
  const email = document.getElementById("regEmail").value.trim();
  const password = document.getElementById("regPassword").value;
  const msg = document.getElementById("regMessage");

  if(!loftName || !ownerName || !contactNumber || !areaName || !email || !password){
    msg.textContent = "Please fill in all fields.";
    return;
  }
  if(!/^[0-9+()\-\s]{7,20}$/.test(contactNumber)){
    msg.textContent = "Please enter a valid contact number.";
    return;
  }
  if(password.length < 6){
    msg.textContent = "Password must be at least 6 characters.";
    return;
  }

  msg.textContent = "Creating account...";
  auth.createUserWithEmailAndPassword(email,password)
    .then(credential=>{
      const user = credential.user;
      return db.ref("members/"+user.uid).set({
        club: club,
        loftName: loftName,
        ownerName: ownerName,
        contactNumber: contactNumber,
        areaName: areaName,
        email: email,
        status: "pending",
        role: "member",
        createdAt: Date.now()
      }).then(()=>{
        msg.textContent = "Registration submitted. Waiting for Admin approval.";
      });
    })
    .catch(error=>{
      msg.textContent = "Registration error: "+error.message;
    });
}

function handleAuthState(user){
  if(!user){
    currentProfile = null;
    show("login");
    document.getElementById("records").textContent = "Please login to view records.";
    return;
  }

  if(user.email && user.email.toLowerCase() === ADMIN_EMAIL.toLowerCase()){
    document.getElementById("userEmail").textContent = user.email;
    document.getElementById("memberInfo").textContent = "Administrator";
    document.getElementById("adminButton").classList.remove("hidden");
    show("home");
    return;
  }

  db.ref("members/"+user.uid).once("value")
    .then(snapshot=>{
      if(!auth.currentUser || auth.currentUser.uid !== user.uid) return;
      if(!snapshot.exists()){
        currentProfile = null;
        document.getElementById("pendingInfo").textContent =
          "Your profile was not found. Please contact Admin.";
        show("pending");
        return;
      }
      currentProfile = snapshot.val();
      if(currentProfile.status !== "approved"){
        document.getElementById("pendingInfo").textContent =
          "Club: "+(currentProfile.club || "")+
          " | Loft: "+(currentProfile.loftName || "");
        show("pending");
        return;
      }
      document.getElementById("userEmail").textContent = user.email || "";
      document.getElementById("memberInfo").textContent =
        (currentProfile.club || "")+" | "+
        (currentProfile.loftName || "")+" | "+
        (currentProfile.areaName || "");
      document.getElementById("adminButton").classList.add("hidden");
      show("home");
    })
    .catch(error=>{
      document.getElementById("pendingInfo").textContent =
        "Unable to check approval: "+error.message;
      show("pending");
    });
}

function logoutUser(){
  if(auth) auth.signOut();
}

function showAdmin(){
  if(!isAdmin()){
    show("pending");
    return;
  }
  show("admin");
  loadPendingMembers();
}

function loadPendingMembers(){
  if(!isAdmin()) return;
  const target = document.getElementById("pendingMembers");
  target.textContent = "Loading...";
  db.ref("members").once("value")
    .then(snapshot=>{
      target.replaceChildren();
      let count = 0;
      snapshot.forEach(child=>{
        const m = child.val() || {};
        if(m.status !== "pending") return;
        count++;
        const card = document.createElement("div");
        card.className = "item";
        const info = document.createElement("p");
        info.textContent =
          "Club: "+(m.club || "")+
          "\nLoft Name: "+(m.loftName || "")+
          "\nLoft Owner: "+(m.ownerName || "")+
          "\nContact: "+(m.contactNumber || "")+
          "\nPlace / Area: "+(m.areaName || "")+
          "\nEmail: "+(m.email || "");
        info.style.whiteSpace = "pre-line";
        const approve = document.createElement("button");
        approve.textContent = "Approve Member";
        approve.onclick = ()=>approveMember(child.key);
        card.append(info,approve);
        target.appendChild(card);
      });
      if(count === 0) target.textContent = "No pending registrations.";
    })
    .catch(error=>{
      target.textContent = "Error loading requests: "+error.message;
    });
}

function approveMember(uid){
  if(!isAdmin()) return;
  if(!confirm("Approve this member?")) return;
  db.ref("members/"+uid+"/status").set("approved")
    .then(()=>loadPendingMembers())
    .catch(error=>{
      alert("Approval failed: "+error.message);
    });
}

function recordPath(){
  return "clubs/"+currentClub+"/"+currentSection.replace(/\s+/g,"_");
}

function canAccessClub(club){
  if(isAdmin()) return true;
  return !!(currentProfile &&
    currentProfile.status === "approved" &&
    currentProfile.club === club);
}

function openClub(club){
  if(!canAccessClub(club)){
    alert("You are not approved for this club.");
    return;
  }
  currentClub = club;
  document.getElementById("clubTitle").textContent =
    club === "KPFA" ? "KPFA - Local" : "CPUC - District Level";
  show("club");
}

function openSection(section){
  if(!canAccessClub(currentClub)){
    alert("Admin approval is required.");
    return;
  }
  currentSection = section;
  document.getElementById("sectionTitle").textContent =
    (currentClub === "KPFA" ? "KPFA - Local" : "CPUC - District Level")+
    " - "+section;
  document.getElementById("recordTitle").value = "";
  document.getElementById("recordText").value = "";
  document.getElementById("saveMessage").textContent = "";
  show("details");
  loadRecords();
}

function saveRecord(){
  if(!auth || !auth.currentUser){
    document.getElementById("saveMessage").textContent = "Please login first.";
    return;
  }
  if(!canAccessClub(currentClub)){
    document.getElementById("saveMessage").textContent =
      "Admin approval is required for this club.";
    return;
  }
  const title = document.getElementById("recordTitle").value.trim();
  const detail = document.getElementById("recordText").value.trim();
  if(!title || !detail){
    document.getElementById("saveMessage").textContent =
      "Enter both title and details.";
    return;
  }
  document.getElementById("saveMessage").textContent = "Saving...";
  const item = {
    title: title,
    detail: detail,
    createdAt: Date.now(),
    createdBy: auth.currentUser.email || ""
  };
  db.ref(recordPath()).push(item)
    .then(()=>{
      document.getElementById("saveMessage").textContent =
        "Saved online successfully!";
      document.getElementById("recordTitle").value = "";
      document.getElementById("recordText").value = "";
      loadRecords();
    })
    .catch(error=>{
      document.getElementById("saveMessage").textContent =
        "Database error: "+error.message;
    });
}

function loadRecords(){
  const target = document.getElementById("records");
  if(!auth || !auth.currentUser){
    target.textContent = "Please login first.";
    return;
  }
  if(!canAccessClub(currentClub)){
    target.textContent = "Admin approval is required.";
    return;
  }
  target.textContent = "Loading records...";
  db.ref(recordPath()).once("value")
    .then(snapshot=>{
      target.replaceChildren();
      if(!snapshot.exists()){
        target.textContent = "No records yet.";
        return;
      }
      snapshot.forEach(child=>{
        const r = child.val() || {};
        const item = document.createElement("div");
        item.className = "item";
        const title = document.createElement("strong");
        title.textContent = r.title || "Record";
        const detail = document.createElement("p");
        detail.textContent = r.detail || "";
        const by = document.createElement("div");
        by.className = "small";
        by.textContent = "Added by: "+(r.createdBy || "Member");
        item.append(title,detail,by);
        target.appendChild(item);
      });
    })
    .catch(error=>{
      target.textContent = "Database error: "+error.message;
    });
}

function goHome(){
  if(isAdmin()){
    show("home");
    return;
  }
  if(currentProfile && currentProfile.status === "approved"){
    show("home");
  }else{
    show("pending");
  }
}

function backToClub(){
  show("club");
}

initializeFirebase();
</script>
</body>
</html>
