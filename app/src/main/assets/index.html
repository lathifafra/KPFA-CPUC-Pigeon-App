<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KPFA CPUC Pigeon App</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#101b35;color:#fff}
header{background:#172b50;padding:20px;text-align:center;border-bottom:3px solid #dcae45}
h1{color:#f5cf70;font-size:23px;margin:0 0 8px}
h2{color:#f5cf70}
main{max-width:600px;margin:auto;padding:18px}
.panel{background:#1b2b4b;padding:18px;border-radius:14px;margin:14px 0}
input,textarea,button{width:100%;padding:12px;margin:7px 0;border-radius:8px;font-size:16px}
input,textarea{border:1px solid #7183a4;background:#fff;color:#111}
button{border:0;background:#dcae45;color:#17213b;font-weight:bold;cursor:pointer}
.secondary{background:#344766;color:white}
.item{background:#253b60;padding:12px;border-radius:8px;margin:8px 0;overflow-wrap:anywhere}
.small{font-size:13px;color:#d6dff0}
.hidden{display:none}
#authMessage,#saveMessage{overflow-wrap:anywhere}
</style>
</head>
<body>
<header>
<h1>KPFA • CPUC</h1>
<div>Karumbukkadai Pigeon Friends Association</div>
</header>
<main>
<section id="login" class="panel">
<h2>Member Login</h2>
<p class="small">Enter your email and password.</p>
<input id="email" type="email" placeholder="Email address" autocomplete="email">
<input id="password" type="password" placeholder="Password (minimum 6 characters)" autocomplete="current-password">
<button onclick="loginUser()">Login</button>
<button class="secondary" onclick="registerUser()">Create Account</button>
<p id="authMessage" role="status"></p>
</section>

<section id="home" class="hidden">
<div class="panel">
<h2>Welcome</h2>
<p id="userEmail" class="small"></p>
<button onclick="openClub('KPFA')">KPFA Pigeon Club</button>
<button onclick="openClub('CPUC')">CPUC Pigeon Club</button>
<button class="secondary" onclick="logoutUser()">Logout</button>
</div>
</section>

<section id="club" class="hidden">
<div class="panel">
<h2 id="clubTitle"></h2>
<button onclick="openSection('Competition Results')">Competition Results</button>
<button onclick="openSection('Race Details')">Race Details</button>
<button onclick="openSection('Participants')">Participants</button>
<button onclick="openSection('Championship')">Championship</button>
<button class="secondary" onclick="goHome()">Back</button>
</div>
</section>

<section id="details" class="hidden">
<div class="panel">
<h2 id="sectionTitle"></h2>
<input id="recordTitle" placeholder="Title / Race / Participant name">
<textarea id="recordText" rows="4" placeholder="Enter result, timing, points or details"></textarea>
<button onclick="saveRecord()">Save Online</button>
<button class="secondary" onclick="loadRecords()">Refresh Records</button>
<button class="secondary" onclick="backToClub()">Back</button>
<p id="saveMessage" class="small" role="status"></p>
</div>
<div class="panel">
<h2>Saved Records</h2>
<div id="records">Sign in to view records.</div>
</div>
</section>
</main>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyD9_4Fq2UpnVmYf8J7ERswACoFM-YiTexk",
  authDomain: "kpfa-cpuc.firebaseapp.com",
  databaseURL: "https://kpfa-cpuc-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "kpfa-cpuc",
  storageBucket: "kpfa-cpuc.firebasestorage.app",
  messagingSenderId: "445696991705",
  appId: "1:445696991705:web:076102fbe42afa2c7239c8"
};

let auth = null;
let db = null;
let currentClub = "KPFA";
let currentSection = "Competition Results";

function show(id){
  ["login","home","club","details"].forEach(x=>{
    document.getElementById(x).classList.toggle("hidden",x!==id);
  });
}

function setAuthMessage(message){
  document.getElementById("authMessage").textContent = message;
}

function initializeFirebase(){
  try{
    if(typeof firebase === "undefined"){
      setAuthMessage("Firebase SDK did not load. Check internet connection and rebuild the APK.");
      return false;
    }
    if(!firebase.apps.length){
      firebase.initializeApp(firebaseConfig);
    }
    auth = firebase.auth();
    db = firebase.database();
    return true;
  }catch(error){
    setAuthMessage("Firebase setup error: "+error.message);
    return false;
  }
}

function registerUser(){
  if(!auth && !initializeFirebase()) return;

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  if(!email || !password){
    setAuthMessage("Please enter email and password.");
    return;
  }
  if(password.length < 6){
    setAuthMessage("Password must be at least 6 characters.");
    return;
  }

  setAuthMessage("Creating account...");

  auth.createUserWithEmailAndPassword(email,password)
    .then(()=>{
      setAuthMessage("Account created successfully!");
    })
    .catch(error=>{
      setAuthMessage("Error: "+error.code+" - "+error.message);
    });
}

function loginUser(){
  if(!auth && !initializeFirebase()) return;

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  if(!email || !password){
    setAuthMessage("Please enter email and password.");
    return;
  }

  setAuthMessage("Logging in...");

  auth.signInWithEmailAndPassword(email,password)
    .then(()=>{
      setAuthMessage("");
    })
    .catch(error=>{
      setAuthMessage("Error: "+error.code+" - "+error.message);
    });
}

function logoutUser(){
  if(auth) auth.signOut();
}

function recordPath(){
  return "clubs/"+currentClub+"/"+currentSection.replace(/\s+/g,"_");
}

function openClub(club){
  currentClub = club;
  document.getElementById("clubTitle").textContent = club+" Pigeon Club";
  show("club");
}

function openSection(section){
  currentSection = section;
  document.getElementById("sectionTitle").textContent = currentClub+" - "+section;
  document.getElementById("recordTitle").value = "";
  document.getElementById("recordText").value = "";
  document.getElementById("saveMessage").textContent = "";
  show("details");
  loadRecords();
}

function saveRecord(){
  if(!auth || !auth.currentUser){
    document.getElementById("saveMessage").textContent = "Please login first.";
    return;
  }

  const title = document.getElementById("recordTitle").value.trim();
  const detail = document.getElementById("recordText").value.trim();

  if(!title || !detail){
    document.getElementById("saveMessage").textContent = "Enter both title and details.";
    return;
  }

  document.getElementById("saveMessage").textContent = "Saving...";

  const item = {
    title: title,
    detail: detail,
    createdAt: Date.now(),
    createdBy: auth.currentUser.email || ""
  };

  db.ref(recordPath()).push(item)
    .then(()=>{
      document.getElementById("saveMessage").textContent = "Saved online successfully!";
      document.getElementById("recordTitle").value = "";
      document.getElementById("recordText").value = "";
      loadRecords();
    })
    .catch(error=>{
      document.getElementById("saveMessage").textContent =
        "Database error: "+error.message;
    });
}

function loadRecords(){
  const target = document.getElementById("records");
  if(!db || !auth || !auth.currentUser){
    target.textContent = "Please login first.";
    return;
  }

  target.textContent = "Loading records...";

  db.ref(recordPath()).once("value")
    .then(snapshot=>{
      target.replaceChildren();

      if(!snapshot.exists()){
        target.textContent = "No records yet.";
        return;
      }

      snapshot.forEach(child=>{
        const r = child.val() || {};
        const item = document.createElement("div");
        item.className = "item";

        const title = document.createElement("strong");
        title.textContent = r.title || "Record";

        const detail = document.createElement("p");
        detail.textContent = r.detail || "";

        const by = document.createElement("div");
        by.className = "small";
        by.textContent = "Added by: "+(r.createdBy || "Member");

        item.append(title,detail,by);
        target.appendChild(item);
      });
    })
    .catch(error=>{
      target.textContent = "Database error: "+error.message;
    });
}

function goHome(){
  show("home");
}

function backToClub(){
  show("club");
}

initializeFirebase();

if(auth){
  auth.onAuthStateChanged(user=>{
    if(user){
      document.getElementById("userEmail").textContent = user.email || "";
      show("home");
    }else{
      show("login");
      document.getElementById("records").textContent = "Please login to view records.";
    }
  });
}
</script>
</body>
</html>
