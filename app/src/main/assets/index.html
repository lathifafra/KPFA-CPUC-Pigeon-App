
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KPFA CPUC Pigeon App</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:#07152e;color:white}
.header{text-align:center;padding:22px 8px;background:#101f40;border-bottom:3px solid #d4af37}
.logo{font-size:42px}
h1{color:#ffd966;margin:8px}
.subtitle{font-size:12px;letter-spacing:1px}
.container{padding:18px;max-width:450px;margin:auto}
.panel,.card{background:#132747;padding:20px;margin:15px 0;border:1px solid #d4af37;border-radius:15px}
h2,h3{color:#ffd966;text-align:center}
label{display:block;margin:14px 0 6px}
input[type=text],input[type=password]{width:100%;padding:13px;border-radius:8px;border:1px solid #d4af37;background:#07152e;color:white;font-size:16px}
button{width:100%;padding:13px;margin-top:12px;border:0;border-radius:8px;background:#d4af37;color:#07152e;font-size:16px;font-weight:bold}
.back{background:white}
.small{text-align:center;color:#d9e2f2;font-size:13px}
#homePage,#clubPage,#sectionPage{display:none}
</style>
</head>
<body>

<div class="header">
<div class="logo">🐦</div>
<h1>KPFA • CPUC</h1>
<div class="subtitle">PIGEON FRIENDS ASSOCIATION</div>
</div>

<div class="container">

<div class="panel" id="loginPage">
<h2>🔐 LOGIN</h2>
<label>Login ID</label>
<input id="username" type="text" placeholder="Enter Login ID">
<label>Password</label>
<input id="password" type="password" placeholder="Enter Password">
<label><input id="showPassword" type="checkbox" style="width:auto"> Show Password</label>
<button onclick="login()">LOGIN</button>
<p id="message" class="small"></p>
<p class="small">KPFA • CPUC Pigeon App</p>
</div>

<div id="homePage">
<div class="card" onclick="openClub('KPFA')">
<h2>🐦 KPFA</h2>
<p class="small">Karumbukkadai Pigeon Friends Association</p>
<button>OPEN KPFA</button>
</div>
<div class="card" onclick="openClub('CPUC')">
<h2>🐦 CPUC</h2>
<p class="small">Coimbatore Pigeon Unity Welfare Association</p>
<button>OPEN CPUC</button>
</div>
<button class="back" onclick="logout()">LOGOUT</button>
</div>

<div id="clubPage" class="panel">
<h2 id="clubTitle"></h2>
<div id="kpfaMenu">
<button onclick="openSection('🏆 Competition Results')">🏆 Competition Results</button>
<button onclick="openSection('🕊️ Race Details')">🕊️ Race Details</button>
<button onclick="openSection('👥 Participants')">👥 Participants</button>
<button onclick="openSection('🥇 Championship')">🥇 Championship</button>
</div>
<div id="cpucInfo" class="small" style="display:none">
Welcome to CPUC Pigeon Association!
</div>
<button class="back" onclick="goHome()">BACK TO HOME</button>
</div>

<div id="sectionPage" class="panel">
<h2 id="sectionTitle"></h2>
<p class="small" id="sectionText"></p>
<button class="back" onclick="backToKPFA()">BACK TO KPFA</button>
</div>

</div>

<script>
document.getElementById("showPassword").addEventListener("change",function(){
document.getElementById("password").type=this.checked?"text":"password";
});

function login(){
var u=document.getElementById("username").value.trim();
var p=document.getElementById("password").value;
if((u==="admin"&&p==="admin123")||(u==="member"&&p==="member123")){
document.getElementById("loginPage").style.display="none";
document.getElementById("homePage").style.display="block";
document.getElementById("message").innerText="";
}else{
document.getElementById("message").innerText="Incorrect Login ID or Password";
}
}

function openClub(club){
document.getElementById("homePage").style.display="none";
document.getElementById("clubPage").style.display="block";
document.getElementById("sectionPage").style.display="none";
document.getElementById("clubTitle").innerText=club;
document.getElementById("kpfaMenu").style.display=club==="KPFA"?"block":"none";
document.getElementById("cpucInfo").style.display=club==="CPUC"?"block":"none";
}

function openSection(section){
document.getElementById("clubPage").style.display="none";
document.getElementById("sectionPage").style.display="block";
document.getElementById("sectionTitle").innerText=section;
document.getElementById("sectionText").innerText="KPFA "+section+" details will be added here.";
}

function backToKPFA(){
document.getElementById("sectionPage").style.display="none";
document.getElementById("clubPage").style.display="block";
}

function goHome(){
document.getElementById("clubPage").style.display="none";
document.getElementById("sectionPage").style.display="none";
document.getElementById("homePage").style.display="block";
}

function logout(){
document.getElementById("homePage").style.display="none";
document.getElementById("clubPage").style.display="none";
document.getElementById("sectionPage").style.display="none";
document.getElementById("loginPage").style.display="block";
document.getElementById("username").value="";
document.getElementById("password").value="";
}
document.getElementById("password").addEventListener("keydown",function(e){
if(e.key==="Enter")login();
});
</script>
</body>
</html>
